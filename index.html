<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>China Expo Hub — Контакты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#E3E8EA;
    --ink:#1B2430; --ink-soft:#5B6773; --border:#D3D8DB;
    --seal:#B4302A; --seal-ink:#7A211D; --gold:#A9822E;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 0;}

  header{display:flex; align-items:center; gap:12px; margin-bottom:6px;}
  .stamp{
    width:44px; height:44px; border-radius:50%;
    border:2px solid var(--seal); color:var(--seal);
    display:flex; align-items:center; justify-content:center;
    font-family:'Newsreader',serif; font-weight:600; font-size:19px;
    transform:rotate(-6deg); flex-shrink:0;
  }
  h1{font-family:'Newsreader',serif; font-weight:600; font-size:21px; letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

  .exhibition-strip{
    margin:16px 0 14px; padding:12px 14px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); font-size:12.5px; color:var(--ink-soft);
    display:flex; justify-content:space-between; align-items:center;
  }
  .exhibition-strip b{color:var(--ink); font-family:'Newsreader',serif; font-weight:600; font-size:14.5px;}
  .exhibition-strip .count{font-family:'IBM Plex Mono',monospace; color:var(--gold); font-size:11.5px;}

  /* Business type filter */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--ink-soft);
    background:var(--surface); font-size:12.5px; color:var(--ink); font-weight:500; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .chip .dot{width:7px; height:7px; border-radius:50%;}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  .search-row{margin-bottom:16px;}
  .search-row input{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink);
  }
  .search-row input::placeholder{color:var(--ink-soft);}

  /* Contact cards */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:10px; position:relative;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .card-name{font-family:'Newsreader',serif; font-weight:600; font-size:16px; line-height:1.3;}
  .card-cn{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .type-badge{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500; letter-spacing:.03em;
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0; margin-top:2px;
    display:flex; align-items:center; gap:5px;
  }
  .type-badge .dot{width:6px; height:6px; border-radius:50%;}
  .type-factory{background:#2E6B3E; color:#fff;}
  .type-factory .dot{background:#fff;}
  .type-trader{background:var(--seal); color:#fff;}
  .type-trader .dot{background:#fff;}
  .type-brand{background:#5B3E9E; color:#fff;}
  .type-brand .dot{background:#fff;}

  .card-industry{
    font-size:11.5px; color:#fff; background:var(--gold); border-radius:6px;
    padding:3px 9px; font-family:'IBM Plex Mono',monospace; font-weight:500; display:inline-block; margin-bottom:12px;
  }

  .contact-grid{display:flex; flex-direction:column; gap:7px; margin-bottom:10px;}
  .contact-row{display:flex; align-items:center; gap:9px; font-size:13px;}
  .contact-row .ico{
    width:22px; height:22px; border-radius:6px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0;
  }
  .contact-row a{color:var(--ink); text-decoration:none; word-break:break-all;}
  .contact-row a:hover{color:var(--seal);}
  .contact-row.muted{color:var(--ink-soft); opacity:.55;}
  .contact-row.muted .ico{background:var(--surface-2);}

  .card-foot{
    display:flex; justify-content:space-between; align-items:center; margin-top:12px;
    padding-top:12px; border-top:1px dashed var(--border); font-size:11.5px; color:var(--ink-soft);
  }
  .verified{display:flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:10px;}
  .verified .dot{width:6px; height:6px; border-radius:50%; background:#2E6B3E;}

  /* Flagship product block */
  .flagship{
    background:linear-gradient(135deg,#FBF8F1,#F3ECDC); border:1px solid #E5D9B8; border-radius:12px;
    padding:14px; margin-bottom:12px; display:flex; gap:12px; align-items:flex-start;
  }
  .flagship-icon{
    width:64px; height:64px; border-radius:10px; background:var(--surface); border:1px solid #E5D9B8;
    display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;
  }
  .flagship-body{flex:1; min-width:0;}
  .flagship-tag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--gold); letter-spacing:.03em;
    margin-bottom:3px; display:block;
  }
  .flagship-name{font-family:'Newsreader',serif; font-weight:600; font-size:14.5px; margin-bottom:4px; line-height:1.25;}
  .flagship-desc{font-size:12px; color:var(--ink-soft); line-height:1.45;}

  .legend{
    margin-top:22px; padding:14px; background:var(--surface); border:1px dashed var(--border);
    border-radius:var(--radius); font-size:11.5px; color:var(--ink-soft); line-height:1.7;
  }
  .legend b{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:10.5px;}

  /* Tabs */
  .tabs{display:flex; gap:8px; margin:16px 0;}
  .tab{
    flex:1; text-align:center; padding:11px; border-radius:10px; border:1.5px solid var(--ink-soft);
    background:var(--surface); font-family:'Newsreader',serif; font-weight:600; font-size:14px;
    color:var(--ink); cursor:pointer;
  }
  .tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* Exhibitions */
  .expo-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; margin-bottom:10px; position:relative;
  }
  .expo-flagship{
    border:2px solid var(--seal); background:linear-gradient(180deg,#FBF3E9,var(--surface) 60px);
  }
  .flagship-ribbon{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
    letter-spacing:.03em; color:#fff; background:var(--seal); padding:4px 10px; border-radius:6px;
    margin-bottom:10px;
  }
  .expo-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .expo-name{font-family:'Newsreader',serif; font-weight:600; font-size:15.5px; line-height:1.3;}
  .expo-en{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .status-badge{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:500; letter-spacing:.03em;
    padding:3px 9px; border-radius:20px; white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:5px;
  }
  .status-upcoming{background:#2E6B3E; color:#fff;}
  .status-upcoming .dot{background:#fff;}
  .status-finished{background:var(--ink-soft); color:#fff;}
  .status-finished .dot{background:#fff;}
  .status-badge .dot{width:6px; height:6px; border-radius:50%;}
  .expo-meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;}
  .expo-tag{
    font-size:11px; border-radius:6px; padding:3px 9px; font-family:'IBM Plex Mono',monospace; font-weight:500;
  }
  .expo-tag.industry{color:#fff; background:var(--gold);}
  .expo-tag.city{color:#fff; background:var(--seal);}
  .expo-dates{font-size:13px; color:var(--ink-soft); margin-bottom:8px;}
  .expo-dates b{color:var(--ink);}
  .expo-foot{display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px dashed var(--border); font-size:12px;}
  .expo-foot a{color:var(--seal-ink); text-decoration:none;}

  .industry-filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .industry-chip{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--gold);
    background:var(--surface); font-size:12.5px; color:#8A6A22; font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .industry-chip.active{background:var(--gold); color:#fff; border-color:var(--gold);}

  .city-filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .city-chip{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px solid var(--seal);
    background:var(--surface); font-size:12.5px; color:var(--seal-ink); font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .city-chip.active{background:var(--seal); color:#fff; border-color:var(--seal);}
  .city-more-toggle{
    flex-shrink:0; padding:7px 14px; border-radius:20px; border:1.5px dashed var(--ink-soft);
    background:var(--surface); font-size:12.5px; color:var(--ink-soft); font-weight:500; cursor:pointer; white-space:nowrap;
  }
  .industry-chip.is-empty, .city-chip.is-empty{opacity:.4;}

  .expo-link-companies{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:8px 12px;
    background:var(--seal); border-radius:8px; font-size:12px; color:#fff; font-weight:500;
    cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .expo-link-companies:hover{background:var(--seal-ink);}

  .tier-badge{
    font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:500; letter-spacing:.02em;
    padding:3px 8px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;
    margin-top:5px;
  }
  .tier-established{background:#5B3E9E; color:#fff;}
  .tier-emerging{background:#B5760A; color:#fff;}
  .tier-newcomer{background:#1E7A8C; color:#fff;}

  /* Filter trigger + pills */
  .filter-trigger-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .filter-trigger{
    display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:20px;
    border:1.5px solid var(--ink); background:var(--ink); color:#fff; font-size:13px; font-weight:500;
    cursor:pointer; flex-shrink:0;
  }
  .filter-badge{
    background:var(--seal); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:10px;
    border-radius:10px; padding:1px 7px; min-width:16px; text-align:center;
  }
  .active-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .active-pill{
    display:flex; align-items:center; gap:6px; padding:6px 10px 6px 12px; border-radius:20px;
    background:var(--surface-2); font-size:12px; color:var(--ink);
  }
  .active-pill .x{cursor:pointer; opacity:.6; font-weight:600;}
  .active-pill .x:hover{opacity:1;}

  /* Modal / bottom sheet */
  .filter-overlay{
    display:none; position:fixed; inset:0; background:rgba(27,36,48,.5); z-index:100;
    align-items:flex-end; justify-content:center;
  }
  .filter-overlay.open{display:flex;}
  .filter-modal{
    background:var(--bg); width:100%; max-width:640px; max-height:82vh; border-radius:20px 20px 0 0;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .filter-modal-header{
    display:flex; justify-content:space-between; align-items:center; padding:16px 20px;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .filter-modal-header h3{font-family:'Newsreader',serif; font-weight:600; font-size:18px;}
  .filter-close{
    width:30px; height:30px; border-radius:50%; background:var(--surface-2); display:flex;
    align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--ink-soft);
  }
  .filter-modal-body{padding:16px 20px; overflow-y:auto; flex:1;}
  .filter-section-title{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em;
    margin:16px 0 8px; font-weight:500;
  }
  .filter-section-title:first-child{margin-top:0;}
  .filter-modal-footer{
    display:flex; justify-content:space-between; align-items:center; padding:14px 20px;
    border-top:1px solid var(--border); background:var(--surface); flex-shrink:0;
  }
  .filter-reset{font-size:13px; color:var(--seal-ink); cursor:pointer; font-weight:500;}
  .filter-apply{
    background:var(--seal); color:#fff; border:none; padding:11px 22px; border-radius:10px;
    font-family:'Inter',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer;
  }

  /* User bar */
  .user-bar{
    display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:14px;
    font-size:12.5px; color:var(--ink-soft);
  }
  .user-bar .name{color:var(--ink); font-weight:600;}
  .sub-badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 9px; border-radius:20px; cursor:pointer;
  }
  .sub-badge.guest{background:var(--surface-2); color:var(--ink-soft);}
  .sub-badge.pro{background:var(--gold); color:#fff;}

  /* Favorite star */
  .fav-star{
    font-size:20px; cursor:pointer; user-select:none; line-height:1; flex-shrink:0;
    filter:grayscale(1); opacity:.4;
  }
  .fav-star.active{filter:none; opacity:1;}

  /* Gated (locked) contact content */
  .contact-row.locked{position:relative;}
  .contact-row.locked > *:not(.lock-overlay){filter:blur(4px); user-select:none; pointer-events:none;}
  .locked-block{
    position:relative; border:1px dashed var(--gold); border-radius:10px; padding:12px;
    margin-top:4px; background:#FBF8F1;
  }
  .locked-block .content{filter:blur(5px); user-select:none; pointer-events:none;}
  .unlock-btn{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; background:rgba(255,255,255,.75); border-radius:10px; cursor:pointer; border:none;
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--seal-ink);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="stamp">中</div>
    <div>
      <h1 id="pageTitle">Выставки Китая</h1>
      <div class="sub" id="pageSub">2025–2026 · ручной сбор из открытых источников</div>
    </div>
  </header>

  <div class="user-bar">
    <span class="name" id="userName">👤 Гость</span>
    <span class="sub-badge guest" id="subBadge" onclick="toggleDemoSubscription()">ГОСТЬ · нажмите для demo-Pro</span>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabExpo" onclick="switchTab('expo')">Выставки</div>
    <div class="tab" id="tabCompanies" onclick="switchTab('companies')">Компании</div>
  </div>

  <!-- ===== ЭКРАН: ВЫСТАВКИ ===== -->
  <div id="screenExpo">
    <div id="expoSummary" style="font-size:12px; color:var(--ink-soft); margin-bottom:10px; font-family:'IBM Plex Mono',monospace;"></div>
    <div class="search-row">
      <input type="text" id="expoSearch" placeholder="Поиск по названию или городу...">
    </div>
    <div class="filter-trigger-row">
      <div class="filter-trigger" onclick="openFilterModal()">
        <span>⚙ Фильтры</span>
        <span class="filter-badge" id="filterBadge" style="display:none">0</span>
      </div>
      <div class="active-pills" id="activePills"></div>
    </div>
    <div id="expoCards"></div>
  </div>

  <!-- ===== МОДАЛКА ФИЛЬТРОВ ===== -->
  <div class="filter-overlay" id="filterOverlay" onclick="if(event.target===this) closeFilterModal()">
    <div class="filter-modal">
      <div class="filter-modal-header">
        <h3>Фильтры</h3>
        <div class="filter-close" onclick="closeFilterModal()">✕</div>
      </div>
      <div class="filter-modal-body">
        <div class="filter-section-title">ОСОБОЕ</div>
        <div class="filters" id="flagshipFilter"></div>
        <div class="filter-section-title">СТАТУС</div>
        <div class="filters" id="statusFilters"></div>
        <div class="filter-section-title">ОТРАСЛЬ</div>
        <div class="industry-filters" id="industryFilters"></div>
        <div class="filter-section-title">ГОРОД</div>
        <div class="city-filters" id="cityFilters"></div
